name: Sync to GitLab

on:
  push:
    branches:
      - main   # change if using another branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/adityasah104/ai-review-agent-pipeline.git
          git push gitlab main --force
